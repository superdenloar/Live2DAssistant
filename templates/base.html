<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- БЛОК 1: ЗАГОЛОВОК СТРАНИЦЫ -->
    <title>{% block title %}Anime Assistant{% endblock %}</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- БЛОК 2: ДОПОЛНИТЕЛЬНЫЕ СКРИПТЫ В <HEAD> -->
    {% block head_scripts %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <!-- Кнопка для открытия меню -->
        <button id="menu-toggle-btn">☰</button>
        <a href="{{ url_for('dash_assistants') }}" class="studio-back" title="Вернуться в кабинет">← Кабинет</a>

        <!-- Выдвижное меню (сайдбар), общее для всех страниц -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>Меню</h3>
                <button id="sidebar-close-btn">×</button>
            </div>
            <nav class="sidebar-nav">
                <!-- Кнопки переключения вкладок внутри index.html -->
                <button class="nav-btn active" data-view="profile-view">Профиль</button>
                <button class="nav-btn" data-view="api-view">Нейросеть (API)</button>
                <button class="nav-btn" data-view="assistants-view">Ассистенты</button>
                <button class="nav-btn" data-view="chats-view">Чаты</button>
            </nav>
            <div class="sidebar-content">
                <!-- БЛОК 3: СОДЕРЖИМОЕ БОКОВОЙ ПАНЕЛИ -->
                {% block sidebar_content %}{% endblock %}
            </div>
        </div>

        <!-- Основной контент страницы -->
        <div class="main-content">
            <!-- БЛОК 4: ОСНОВНОЙ КОНТЕНТ -->
            {% block main_content %}{% endblock %}
        </div>
    </div>

    <!-- Общий скрипт для всех страниц -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    
    <!-- БЛОК 5: ДОПОЛНИТЕЛЬНЫЕ СКРИПТЫ В КОНЦЕ BODY -->
    {% block body_scripts %}{% endblock %}
</body>
</html>
