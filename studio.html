<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Студия — Live2D & 3D Assistant</title>
<link rel="stylesheet" href="./static/app.css">
<script src="./static/libs/live2dcubismcore.min.js"></script>
<script src="./static/libs/pixi.min.js"></script>
<script src="./static/libs/cubism4.min.js"></script>
<style>
  body, html { margin:0; padding:0; height:100%; overflow:hidden; background:#0f111a; color:#fff; font-family:var(--font); }
  .studio-layout { display:flex; height:100%; position:relative; }
  .studio-nav { position:absolute; top:16px; left:20px; z-index:20; display:flex; gap:10px; }
  .stage-box { flex:1; position:relative; display:grid; place-items:center; }
  #three-stage { width:100%; height:100%; position:absolute; inset:0; }
  #live2d-stage { width:100%; height:100%; display:none; }
  .chat-panel { width:420px; background:rgba(22,25,38,.92); backdrop-filter:blur(16px); border-left:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column; padding:18px; }
  .chat-head { padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,.1); display:flex; justify-content:space-between; align-items:center; }
  .chat-log { flex:1; overflow-y:auto; padding:16px 0; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 14px; border-radius:14px; font-size:13.5px; max-width:85%; word-wrap:break-word; line-height:1.45; }
  .msg.u { align-self:flex-end; background:var(--violet); color:#fff; }
  .msg.a { align-self:flex-start; background:rgba(255,255,255,.08); color:#e5e7eb; border:1px solid rgba(255,255,255,.1); }
  .chips { display:flex; gap:6px; margin-bottom:10px; overflow-x:auto; scrollbar-width:none; }
  .chips button { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); color:#ccc; border-radius:14px; padding:4px 10px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .chips button:hover { background:var(--violet); color:#fff; }
  .input-bar { display:flex; gap:8px; }
  .input-bar input { flex:1; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:10px 14px; color:#fff; font-size:13.5px; outline:none; }
  .input-bar input:focus { border-color:var(--violet); }
  .input-bar button { background:var(--violet); color:#fff; border:none; border-radius:10px; width:42px; height:42px; cursor:pointer; font-size:16px; }
  .tracking-hint { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.65); padding:6px 14px; border-radius:20px; font-size:12px; color:#d8b4fe; pointer-events:none; }
</style>
</head>
<body>
<div class="studio-layout">
  <div class="studio-nav">
    <a class="btn btn-ghost btn-sm" href="./dashboard.html" style="color:#fff;background:rgba(22,25,38,.8);border-color:rgba(255,255,255,.2)">← В кабинет</a>
    <button class="btn btn-ghost btn-sm" style="color:#fff;background:rgba(22,25,38,.8);border-color:rgba(255,255,255,.2)" onclick="toggleModel()">Переключить модель (3D / Live2D)</button>
  </div>

  <div class="stage-box">
    <div id="three-stage"></div>
    <canvas id="live2d-stage"></canvas>
    <div class="tracking-hint">● Модель следит за вашим курсором мыши</div>
  </div>

  <div class="chat-panel">
    <div class="chat-head">
      <div><b id="char-name">Аюми (3D Риг)</b><div style="font-size:11px;color:#1FAF8B">● Онлайн в студии</div></div>
      <button class="btn btn-icon" id="sound-btn" onclick="toggleSound()" title="Вкл/Выкл озвучку" style="color:#fff">🔊</button>
    </div>
    <div class="chat-log" id="log">
      <div class="msg a">Привет! Я персонаж студии. Можешь двигать курсор вокруг меня или отправить команду ниже!</div>
    </div>
    <div class="chips">
      <button onclick="sendQuick('Покивай головой')">Кивни</button>
      <button onclick="sendQuick('Помаши головой')">Помаши</button>
      <button onclick="sendQuick('Кто ты?')">Кто ты?</button>
      <button onclick="sendQuick('Расскажи шутку')">Шутка</button>
    </div>
    <div class="input-bar">
      <input type="text" id="inp" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<script type="module">
  import { createModel3DAvatar } from './static/model3d_avatar.js';

  let model3D = null;
  let is2D = false;
  let pixi = null, model2D = null;
  let soundOn = true;

  // Инициализация 3D Аюми
  async function init3D() {
    const box = document.getElementById('three-stage');
    if (model3D) return;
    try {
      model3D = await createModel3DAvatar(box, {
        url: './static/models3d/ayumi_rigged.glb',
        scale: 1.0,
        offset_y: 0,
        rotate_y: 0,
        follow: true
      }, { base: '' });
    } catch(e) { console.warn('3D error:', e); }
  }
  init3D();

  window.toggleModel = async function() {
    is2D = !is2D;
    const box3D = document.getElementById('three-stage');
    const canvas2D = document.getElementById('live2d-stage');
    const label = document.getElementById('char-name');

    if (is2D) {
      box3D.style.display = 'none';
      canvas2D.style.display = 'block';
      label.textContent = 'Цубаса (Live2D)';
      if (!model2D) {
        pixi = new PIXI.Application({ view: canvas2D, autoStart: true, backgroundAlpha: 0, resizeTo: canvas2D.parentElement });
        model2D = await PIXI.live2d.Live2DModel.from('./static/Live2d_models/TUBASA/TUBASA_014.model3.json');
        pixi.stage.addChild(model2D);
        const s = (canvas2D.parentElement.clientHeight / model2D.height) * 1.8;
        model2D.scale.set(s);
        model2D.x = canvas2D.parentElement.clientWidth / 2 - model2D.width / 2;
      }
    } else {
      box3D.style.display = 'block';
      canvas2D.style.display = 'none';
      label.textContent = 'Аюми (3D Риг)';
    }
  };

  window.toggleSound = function() {
    soundOn = !soundOn;
    document.getElementById('sound-btn').textContent = soundOn ? '🔊' : '🔇';
    if (!soundOn && window.speechSynthesis) window.speechSynthesis.cancel();
  };

  window.sendQuick = function(txt) {
    document.getElementById('inp').value = txt;
    sendMsg();
  };

  window.sendMsg = function() {
    const inp = document.getElementById('inp');
    const val = inp.value.trim();
    if (!val) return;
    inp.value = '';
    
    append(val, 'u');

    setTimeout(() => {
      let reply = '【Киваю головой】 Я внимательно тебя слушаю!';
      const l = val.toLowerCase();
      if (l.includes('кивн') || l.includes('покивай')) {
        model3D?.command('NOD_HEAD');
        reply = '【Киваю головой】 Киваю в знак согласия!';
      } else if (l.includes('помаши') || l.includes('нет')) {
        model3D?.command('SHAKE_HEAD');
        reply = '【Махаю головой】 Не согласна!';
      } else if (l.includes('кто ты')) {
        model3D?.command('NOD_HEAD');
        reply = 'Я твой персональный интерактивный ассистент с 3D телом и голосом!';
      } else if (l.includes('шутк')) {
        reply = 'Колобок повесился, а русалка села на шпагат!';
      }
      append(reply, 'a');
      speak(reply);
    }, 400);
  };

  function append(txt, cls) {
    const log = document.getElementById('log');
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = txt;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  function speak(txt) {
    if (!soundOn || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const clean = txt.replace(/【[^】]+】/g, '').trim();
    const ut = new SpeechSynthesisUtterance(clean);
    ut.lang = 'ru-RU';
    ut.pitch = 1.15;
    window.speechSynthesis.speak(ut);
  }
</script>
</body>
</html>
